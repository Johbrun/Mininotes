name: Security Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        with:
          fetch-depth: 0
      
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.2
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          format: table
